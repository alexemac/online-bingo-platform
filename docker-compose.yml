version: '3.8'

services:
  mongo:
    image: mongo:5.0
    container_name: bingo-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo_data:/data/db
    networks:
      - bingo-network

  redis:
    image: redis:7-alpine
    container_name: bingo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bingo-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bingo-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongo:27017/bingo?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-secret-key-change-in-production
    depends_on:
      - mongo
      - redis
    volumes:
      - ./backend/src:/app/src
    networks:
      - bingo-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bingo-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000
      REACT_APP_WS_URL: ws://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - bingo-network
    command: npm start

volumes:
  mongo_data:
  redis_data:

networks:
  bingo-network:
    driver: bridge
